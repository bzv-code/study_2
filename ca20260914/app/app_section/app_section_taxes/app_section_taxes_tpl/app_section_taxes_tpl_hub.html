<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налоги - Агрегатор Калькуляторов</title>
    <link rel="stylesheet" href="/static/app_section_taxes/app_section_taxes_static_style_global.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📊 Раздел: Налоги</h1>
            <a href="/" class="back-link">← Вернуться на главную</a>
        </header>

        <div class="calculators-grid">
            {% for calc in calculators %}
            <a href="{{ calc.url }}" class="calculator-card">
                <div class="calc-icon">{{ calc.icon }}</div>
                <h2>{{ calc.name }}</h2>
                <p>{{ calc.description }}</p>
                <span class="calc-button">Открыть калькулятор →</span>
            </a>
            {% endfor %}
        </div>

        <footer class="footer">
            <p>Агрегатор Калькуляторов © 2026</p>
        </footer>
    </div>
</body>
</html>
